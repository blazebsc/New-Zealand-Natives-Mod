pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'KikuGie Releases'
            url = 'https://maven.kikugie.dev/releases'
        }
        maven {
            name = 'KikuGie Snapshots'
            url = 'https://maven.kikugie.dev/snapshots'
        }
        gradlePluginPortal()
    }
}

plugins {
    id("dev.kikugie.stonecutter").version "0.9.8"
    id("dev.kikugie.loom-back-compat").version "0.4.2"
}

stonecutter {
    // Enable Groovy DSL, as Stonecutter uses Kotlin by default
    kotlinController = false
    centralScript = "build.gradle"

    create(rootProject) {
        versions '1.21.1', '1.21.11', '26.2', '26.3'
        versions(['1.21.1-neoforge': '1.21.1']).buildscript 'build.neoforge.gradle'
    }
}
