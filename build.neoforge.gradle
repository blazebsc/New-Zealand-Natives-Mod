plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

version = "${project.mod_version}+${sc.current.version}-neoforge"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version

    mods {
        register("newzealandnatives") {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        register("client") {
            client()
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    mavenCentral()
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${project.geckolib_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }

    exclude("fabric.mod.json")
}

sourceSets {
    // Stonecutter maps shared src/<name> into the same-named source set.
    // NeoForge has no client split, so the processed client sources compile as part of main.
    create("client")
    main {
        java {
            srcDir("build/generated/stonecutter/client/java")
            exclude 'blake7/client/NativesModMenu.java'
            exclude 'blake7/client/NativesConfigScreen.java'
            exclude 'blake7/client/newzealandnativesmodDataGenerator.java'
            exclude 'blake7/client/newzealandnativesmodClient.java'
            exclude 'blake7/newzealandnativesmod/NewZealandNativesMod.java'
            exclude 'blake7/newzealandnativesmod/registry/NativesItemGroups.java'
            exclude 'blake7/newzealandnativesmod/registry/NativesSpawns.java'
        }
    }
}

// The client source set exists only so Stonecutter processes src/client;
// its output compiles once, as part of main.
tasks.named("compileClientJava") {
    enabled = false
}
tasks.named("compileJava") {
    dependsOn("stonecutterGenerateClient")
}
// sourcesJar is registered lazily; wire the generated-sources dependency once present.
afterEvaluate {
    tasks.findByName("sourcesJar")?.dependsOn("stonecutterGenerateClient")
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

stonecutter {
    constants.put('fabric', false)
    constants.put('neoforge', true)

    // Shared sources are Mojang-mapped since the all-mappings unification;
    // no Yarn->Mojang replacement table is needed anymore.
}

