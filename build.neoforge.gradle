        replace 'LookAroundGoal', 'RandomLookAroundGoal'
        replace 'new SwimGoal(', 'new FloatGoal('
        replace 'SitGoal', 'SitWhenOrderedToGoal'
        replace 'FleeEntityGoal', 'AvoidEntityGoal'
        replace 'ActiveTargetGoal', 'NearestAttackableTargetGoal'
        replace 'AvoidSunlightGoal', 'FleeSunGoal'
        replace 'FoodComponent', 'FoodProperties'
        replace 'SpawnGroup', 'MobCategory'
