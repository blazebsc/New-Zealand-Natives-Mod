        replace 'net.minecraft.block.LeavesBlock', 'net.minecraft.world.level.block.LeavesBlock'
        replace 'net.minecraft.block.MapColor', 'net.minecraft.world.level.material.MapColor'
        replace 'net.minecraft.block.PillarBlock', 'net.minecraft.world.level.block.RotatedPillarBlock'
        replace 'net.minecraft.block.SaplingBlock', 'net.minecraft.world.level.block.SaplingBlock'
        replace 'net.minecraft.block.SaplingGenerator', 'net.minecraft.world.level.block.grower.TreeGrower'
        replace 'net.minecraft.item.BlockItem', 'net.minecraft.world.item.BlockItem'
        replace 'net.minecraft.item.Item', 'net.minecraft.world.item.Item'
        replace 'net.minecraft.item.ItemStack', 'net.minecraft.world.item.ItemStack'
        replace 'net.minecraft.item.Items', 'net.minecraft.world.item.Items'
        replace 'net.minecraft.item.SpawnEggItem', 'net.minecraft.world.item.SpawnEggItem'
        replace 'net.minecraft.entity.damage.DamageSource', 'net.minecraft.world.damagesource.DamageSource'
        // Simple names that differ between mappings
        replace 'DolphinEntityRenderer', 'DolphinRenderer'
        replace 'EntityRendererFactory', 'EntityRendererProvider'
        replace 'DefaultAttributeContainer', 'AttributeSupplier'
        replace 'EntityAttributes', 'Attributes'
        replace 'SaplingGenerator', 'TreeGrower'
        replace 'PillarBlock', 'RotatedPillarBlock'
        replace 'DefaultFeatureConfig', 'NoneFeatureConfiguration'
        replace 'FeatureContext', 'FeaturePlaceContext'
        replace 'BirdNavigation', 'FlyingPathNavigation'
        replace 'EntityNavigation', 'PathNavigation'
        replace 'FlightMoveControl', 'FlyingMoveControl'
        replace 'HostileEntity', 'Monster'
        replace 'MobEntity', 'Mob'
        replace 'PathAwareEntity', 'PathfinderMob'
        replace 'AnimalEntity', 'Animal'
        replace 'extends DolphinEntity', 'extends Dolphin'
        replace 'DolphinEntity entity', 'Dolphin entity'
        replace '<? extends DolphinEntity>', '<? extends Dolphin>'
        replace 'PassiveEntity', 'AgeableMob'
        replace 'TameableEntity', 'TamableAnimal'
        replace 'PlayerEntity', 'Player'
        replace 'AnimalMateGoal', 'BreedGoal'
        replace 'WanderAroundFarGoal', 'WaterAvoidingRandomStrollGoal'
