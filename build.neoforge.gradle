plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

version = "${project.mod_version}+${sc.current.version}-neoforge"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version

    mods {
        register("newzealandnatives") {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        register("client") {
            client()
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    mavenCentral()
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${project.geckolib_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }

    exclude("fabric.mod.json")
}

sourceSets {
    // Stonecutter maps shared src/<name> into the same-named source set.
    // NeoForge has no client split, so the processed client sources compile as part of main.
    create("client")
    main {
        java {
            srcDir("build/generated/stonecutter/client/java")
            exclude 'blake7/client/NativesModMenu.java'
            exclude 'blake7/client/NativesConfigScreen.java'
            exclude 'blake7/client/newzealandnativesmodDataGenerator.java'
            exclude 'blake7/client/newzealandnativesmodClient.java'
            exclude 'blake7/newzealandnativesmod/NewZealandNativesMod.java'
            exclude 'blake7/newzealandnativesmod/registry/NativesItemGroups.java'
            exclude 'blake7/newzealandnativesmod/registry/NativesSpawns.java'
        }
    }
}

// The client source set exists only so Stonecutter processes src/client;
// its output compiles once, as part of main.
tasks.named("compileClientJava") {
    enabled = false
}
tasks.named("compileJava") {
    dependsOn("stonecutterGenerateClient")
}
// sourcesJar is registered lazily; wire the generated-sources dependency once present.
afterEvaluate {
    tasks.findByName("sourcesJar")?.dependsOn("stonecutterGenerateClient")
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

stonecutter {
    constants.put('fabric', false)
    constants.put('neoforge', true)

    // ponytail: Yarn -> Mojang-official mappings for the shared sources.
    // Verified entry-by-entry against Mojang 1.21.1 client_mappings.txt;
    // longest-first so nested names (e.g. DolphinEntityRenderer) resolve correctly.
    // Rules apply in declaration order: statement-level specifics before generic substrings.
    replacements.string(true) {
        // Statement-level specifics (must precede the generic rules below)
        replace '.getWorld().isClient', '.level().isClientSide'
        replace 'this.getWorld().sendEntityStatus(this, (byte) 7);', 'if (this.level() instanceof ServerLevel serverLevel) serverLevel.broadcastEntityEvent(this, (byte) 7);'
        replace 'this.getWorld().sendEntityStatus(this, (byte) 6);', 'if (this.level() instanceof ServerLevel serverLevel) serverLevel.broadcastEntityEvent(this, (byte) 6);'
        replace 'stack.decrementUnlessCreative(1, player);', 'if (!player.getAbilities().instabuild) stack.shrink(1);'
        replace 'sizeFor(e).width()', 'sizeFor(e).width'
        replace 'sizeFor(e).height()', 'sizeFor(e).height'
        replace 'public boolean generate(FeatureContext', 'public boolean place(FeaturePlaceContext'
        replace 'origin.add(random.nextInt(13) - 6, 0, random.nextInt(13) - 6)', 'origin.offset(random.nextInt(13) - 6, 0, random.nextInt(13) - 6)'
        replace 'if (!mob.getWorld().isAir(BlockPos.ofFloored(x, y, z))) continue;', 'if (!mob.level().getBlockState(BlockPos.containing(x, y, z)).isAir()) continue;'
        // Classes (fully qualified, longest first)
        replace 'net.minecraft.entity.ai.control.FlightMoveControl', 'net.minecraft.world.entity.ai.control.FlyingMoveControl'
        replace 'net.minecraft.entity.ai.pathing.BirdNavigation', 'net.minecraft.world.entity.ai.navigation.FlyingPathNavigation'
        replace 'net.minecraft.entity.ai.pathing.EntityNavigation', 'net.minecraft.world.entity.ai.navigation.PathNavigation'
        replace 'net.minecraft.entity.attribute.DefaultAttributeContainer', 'net.minecraft.world.entity.ai.attributes.AttributeSupplier'
        replace 'net.minecraft.entity.attribute.EntityAttributes', 'net.minecraft.world.entity.ai.attributes.Attributes'
        replace 'net.minecraft.entity.passive.DolphinEntity', 'net.minecraft.world.entity.animal.Dolphin'
        replace 'net.minecraft.entity.passive.AnimalEntity', 'net.minecraft.world.entity.animal.Animal'
        replace 'net.minecraft.entity.passive.PassiveEntity', 'net.minecraft.world.entity.AgeableMob'
        replace 'net.minecraft.entity.passive.TameableEntity', 'net.minecraft.world.entity.TamableAnimal'
        replace 'net.minecraft.entity.player.PlayerEntity', 'net.minecraft.world.entity.player.Player'
        replace 'net.minecraft.entity.mob.HostileEntity', 'net.minecraft.world.entity.monster.Monster'
        replace 'net.minecraft.entity.mob.MobEntity', 'net.minecraft.world.entity.Mob'
        replace 'net.minecraft.entity.mob.PathAwareEntity', 'net.minecraft.world.entity.PathfinderMob'
        replace 'net.minecraft.entity.ai.goal.ActiveTargetGoal', 'net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal'
        replace 'net.minecraft.entity.ai.goal.AnimalMateGoal', 'net.minecraft.world.entity.ai.goal.BreedGoal'
        replace 'net.minecraft.entity.ai.goal.AvoidSunlightGoal', 'net.minecraft.world.entity.ai.goal.FleeSunGoal'
        replace 'net.minecraft.entity.ai.goal.FleeEntityGoal', 'net.minecraft.world.entity.ai.goal.AvoidEntityGoal'
        replace 'net.minecraft.entity.ai.goal.FollowOwnerGoal', 'net.minecraft.world.entity.ai.goal.FollowOwnerGoal'
        replace 'net.minecraft.entity.ai.goal.FollowParentGoal', 'net.minecraft.world.entity.ai.goal.FollowParentGoal'
        replace 'net.minecraft.entity.ai.goal.LookAtEntityGoal', 'net.minecraft.world.entity.ai.goal.LookAtPlayerGoal'
        replace 'net.minecraft.entity.ai.goal.LookAroundGoal', 'net.minecraft.world.entity.ai.goal.RandomLookAroundGoal'
