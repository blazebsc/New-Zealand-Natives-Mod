plugins {
    id "dev.kikugie.stonecutter"
}

stonecutter.active "1.21.1"

// src/ holds the ACTIVE version's state (yarn 1.21.1). Era folds live in
// their own bands; 26.x is converted by the inverse band at the bottom.
// No rule target may equal another rule's source in the merged band set.
stonecutter.parameters {
    replacements {
        // Era folds (src is yarn 1.21.1):
        //   <= '1.20.4'                  yarn 1.21-era -> yarn 1.20-era
        //   <  '1.20.2'                  1.20.1-only spellings
        //   > '1.21.1' && < '26.1'       the yarn 1.21.11 drift window
        string(current.parsed <= '1.20.4') {
            // Only 1.20.1/1.20.4 read the builder as hunger/saturationModifier;
            // 1.20.6+ kept mojang's nutrition/saturationModifier names.
            replace '.nutrition(', '.hunger('
            // Yarn 1.20.x's EntityType.Builder setter is setDimensions, not dimensions.
            // 1.20.x yarn predates the component-type package move.
            replace 'net.minecraft.component.type.FoodComponent', 'net.minecraft.item.FoodComponent'
            replace 'ConventionalBiomeTags.IS_PLAINS', 'ConventionalBiomeTags.PLAINS'
            replace 'ConventionalBiomeTags.IS_SAVANNA', 'ConventionalBiomeTags.SAVANNA'
            replace 'ConventionalBiomeTags.IS_SWAMP', 'ConventionalBiomeTags.SWAMP'
            replace 'ConventionalBiomeTags.IS_FLOWER_FOREST', 'ConventionalBiomeTags.FLOWER_FORESTS'
            replace ', 0, state -> ', ', state -> '
        }
        // 1.21.11 and 26.x both dropped yarn's GENERIC_ prefix on the entity
        // attributes; 1.20.1-1.21.1 kept it. src/ carries the prefixed spelling.
        string(current.parsed > '1.21.1') {
            replace 'GENERIC_MAX_HEALTH', 'MAX_HEALTH'
            replace 'GENERIC_MOVEMENT_SPEED', 'MOVEMENT_SPEED'
            replace 'GENERIC_FOLLOW_RANGE', 'FOLLOW_RANGE'
            replace 'GENERIC_FLYING_SPEED', 'FLYING_SPEED'
            replace 'GENERIC_ATTACK_DAMAGE', 'ATTACK_DAMAGE'
        }
        // The string executor rejects two rules with the same target even in
        // disjoint bands. The 1.20.1 sit setter is spelled directly in src's
        // <1.20.2 gate branches instead (yarn uses setSitting across the board).
        // 1.21.11 drift. This window contains exactly one node, so it doubles as
        // the "yarn 1.21.11" band: names verified against the 1.21.11 yarn tiny.
        string(current.parsed > '1.21.1' && current.parsed < '26.1') {
            replace '.setId(', '.registryKey('
            replace 'simpleCodec(', 'createCodec('
            replace 'spawnFallingLeavesParticle', 'spawnLeafParticle'
            replace 'canSimulateMovement', 'canMoveVoluntarily'
            replace 'MapCodec<? extends LeavesBlock> codec()', 'MapCodec<? extends LeavesBlock> getCodec()'
            // client: fabric's render-layer registry moved into rendering-v1 for
            // 1.21.2+, but the Minecraft layer enum keeps its yarn name here.
            replace 'net.minecraft.client.renderer.chunk.ChunkSectionLayer;', 'net.minecraft.client.render.BlockRenderLayer;'
            replace 'ChunkSectionLayer.', 'BlockRenderLayer.'
        }
        // 26.x is Mojang-native; src is yarn 1.21.1. Class rules are
        // verified against the 26.2/26.3 loom-cache jars; member rules
        // come from inverting the hand-tuned forward band; bare rules are
        // usage-shape anchored with a prefix-arithmetic suffix check.
        string(current.parsed >= '26.1') {
            replace 'GuiGraphics', 'GuiGraphicsExtractor'
            replace 'software.bernie.geckolib', 'com.geckolib'
            replace 'import net.minecraft.client.render.entity.state.DolphinEntityRenderState;', 'import net.minecraft.client.renderer.entity.state.DolphinRenderState;'
            replace 'origin.add(random.nextInt(13) - 6, 0, random.nextInt(13) - 6)', 'origin.offset(random.nextInt(13) - 6, 0, random.nextInt(13) - 6)'
            replace 'net.minecraft.client.render.entity.state.EntityRenderState', 'net.minecraft.client.renderer.entity.state.EntityRenderState'
            replace 'net.minecraft.client.render.entity.DolphinEntityRenderer', 'net.minecraft.client.renderer.entity.DolphinRenderer'
            replace 'net.minecraft.client.render.entity.EntityRendererFactory', 'net.minecraft.client.renderer.entity.EntityRendererProvider'
            replace 'net.minecraft.entity.attribute.DefaultAttributeContainer', 'net.minecraft.world.entity.ai.attributes.AttributeSupplier'
            replace 'net.minecraft.world.gen.feature.DefaultFeatureConfig', 'net.minecraft.world.level.levelgen.feature.configurations.NoneFeatureConfiguration'
            replace 'net.minecraft.client.gui.widget.CyclingButtonWidget', 'net.minecraft.client.gui.components.CycleButton'
            replace 'net.minecraft.world.gen.feature.util.FeatureContext', 'net.minecraft.world.level.levelgen.feature.FeaturePlaceContext'
            replace 'import net.minecraft.component.type.FoodComponent;', 'import net.minecraft.world.food.FoodProperties;'
            replace 'net.minecraft.entity.ai.control.FlightMoveControl', 'net.minecraft.world.entity.ai.control.FlyingMoveControl'
            replace 'net.minecraft.world.gen.feature.ConfiguredFeature', 'net.minecraft.world.level.levelgen.feature.ConfiguredFeature'
            replace 'net.minecraft.entity.ai.goal.WanderAroundFarGoal', 'net.minecraft.world.entity.ai.goal.WaterAvoidingRandomStrollGoal'
            replace 'net.minecraft.entity.ai.pathing.EntityNavigation', 'net.minecraft.world.entity.ai.navigation.PathNavigation'
            replace 'net.minecraft.entity.effect.StatusEffectInstance', 'net.minecraft.world.effect.MobEffectInstance'
            replace 'net.minecraft.entity.attribute.EntityAttributes', 'net.minecraft.world.entity.ai.attributes.Attributes'
