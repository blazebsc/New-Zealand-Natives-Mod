name: Release

# Two ways to cut a release:
#   1. Automatic: bump mod_version in gradle.properties and push a version
#      branch. If <minecraft_version>-v<mod_version> doesn't exist yet, this
#      builds and publishes it (0.x goes out as a pre-release).
#   2. Manual: git tag <mc>-v<mod> && git push origin <mc>-v<mod> from your
#      own machine. The tag must match gradle.properties or the run fails.
#
# (Tagging and publishing live in this one workflow on purpose: tags pushed
# with GitHub's automatic token don't trigger other workflows, so a
# separate auto-tag workflow could never kick off a release.)

on:
  push:
    tags:
      - '*-v*'
    branches:
      - '1.21.1'
      - '1.21.11'
      - '26.2'
      - '26.3'
    paths:
      - gradle.properties

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        id: tag
        run: |
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          EXPECTED="$MC-v$MOD"
          echo "mc=$MC" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "$EXPECTED" ]; then
              echo "Tag ${{ github.ref_name }} does not match gradle.properties ($EXPECTED)"
              exit 1
            fi
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$EXPECTED" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$EXPECTED" >/dev/null 2>&1; then
              echo "Tag $EXPECTED already exists, nothing to do."
              echo "is_new=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version $EXPECTED, will build and publish."
              echo "is_new=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build
        if: steps.tag.outputs.is_new == 'true'
        run: ./gradlew build --no-daemon

      - name: Tag jars with MC version
        if: steps.tag.outputs.is_new == 'true'
        run: |
          cd build/libs
          for f in *.jar; do
            mv "$f" "${f%.jar}+${{ steps.tag.outputs.mc }}.jar"
          done
          ls

      - name: Decide pre-release
        id: flags
        if: steps.tag.outputs.is_new == 'true'
        run: |
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [[ "$MOD" == 0.* || "$MOD" == *-* ]]; then
            echo "pre-release $MOD detected"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "full release $MOD"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.tag.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: build/libs/*.jar
          generate_release_notes: true
          prerelease: ${{ steps.flags.outputs.prerelease == 'true' }}
